name: Atualizar conteúdo do dia

on:
  schedule:
    - cron: "47 8 * * *"   # todo dia às 5h47 (horário de Brasília)
  workflow_dispatch:        # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Buscar o conteúdo do dia
        run: node scripts/atualizar.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Salvar no repositório
        run: |
          git config user.name "Fé Diária"
          git config user.email "actions@users.noreply.github.com"
          git add data/dados.json
          git diff --cached --quiet || git commit -m "Conteúdo do dia $(TZ=America/Sao_Paulo date +%F)"
          git push
